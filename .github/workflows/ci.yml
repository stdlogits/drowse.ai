name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  python:
    # Browser-runtime build and validation tools, tested against the pinned
    # drowse submodule they import.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e "./drowse[dev]"
      - run: pytest -q

  webui:
    runs-on: ubuntu-latest
    env:
      DROWSE_STORAGE_BROWSERS: chromium
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install the drowse submodule for Python artifact checks
        run: pip install -e ./drowse pyarrow
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: webui
      - name: Allow the pinned Chrome sandbox to create user namespaces
        working-directory: webui
        run: |
          chrome_path="$(node --input-type=module -e 'import puppeteer from "puppeteer"; console.log(await puppeteer.executablePath())')"
          test -x "$chrome_path"
          printf '%s\n' \
            'abi <abi/4.0>,' \
            'include <tunables/global>' \
            "profile drowse-webmcp-chrome \"$chrome_path\" flags=(unconfined) {" \
            '  userns,' \
            '}' | sudo tee /etc/apparmor.d/drowse-webmcp-chrome
          sudo apparmor_parser -r /etc/apparmor.d/drowse-webmcp-chrome
      - run: npm run check
        working-directory: webui
      - run: npm run test:webmcp:native
        working-directory: webui
      - run: npm run check:hosted
        working-directory: webui
      - run: npm run test:hosted
        working-directory: webui

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
        working-directory: .
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --workers=3
      - name: Keep failure traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failures
          path: /tmp/drowse-playwright-results
          retention-days: 3

  contact-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webui/contact-worker
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            webui/contact-worker/package-lock.json
      - name: Install dependencies for shared contact validation
        run: npm ci
        working-directory: .
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  fitting-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Install Rust components and WebAssembly target
        run: |
          rustup component add rustfmt clippy
          rustup target add wasm32-unknown-unknown
      - run: cargo fmt --manifest-path browser-runtime/fitting-wasm/Cargo.toml -- --check
      - run: cargo test --locked --manifest-path browser-runtime/fitting-wasm/Cargo.toml
      - run: cargo clippy --locked --manifest-path browser-runtime/fitting-wasm/Cargo.toml --all-targets -- -D warnings
