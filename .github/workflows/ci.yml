name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  python:
    # Browser-runtime build and validation tools, tested against the pinned
    # drowse submodule they import.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e "./drowse[dev]"
      - run: pytest -q

  webui-build:
    runs-on: ubuntu-latest
    env:
      DROWSE_STORAGE_BROWSERS: chromium
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install the drowse submodule for Python artifact checks
        run: pip install -e ./drowse
      - run: npm ci
      - name: Install the pinned Playwright browsers
        run: npx playwright install --with-deps chromium webkit firefox
        working-directory: webui
      - name: Allow the pinned Chrome sandbox to create user namespaces
        working-directory: webui
        run: |
          chrome_path="$(node --input-type=module -e 'import puppeteer from "puppeteer"; console.log(await puppeteer.executablePath())')"
          test -x "$chrome_path"
          printf '%s\n' \
            'abi <abi/4.0>,' \
            'include <tunables/global>' \
            "profile drowse-webmcp-chrome \"$chrome_path\" flags=(unconfined) {" \
            '  userns,' \
            '}' | sudo tee /etc/apparmor.d/drowse-webmcp-chrome
          sudo apparmor_parser -r /etc/apparmor.d/drowse-webmcp-chrome
      - run: npm run check
        working-directory: webui
      - name: Verify native WebMCP with pinned Chrome and Puppeteer
        run: npm run test:webmcp:native
        working-directory: webui
      - run: npm run check:hosted
        working-directory: webui
      - run: npm run test:hosted
        working-directory: webui

  webui-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
        working-directory: .
      - name: Install the pinned Playwright browsers
        run: npx playwright install --with-deps chromium webkit firefox
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/6 --workers=1
      - name: Preserve browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-failures-${{ matrix.shard }}
          path: /tmp/drowse-playwright-results
          retention-days: 3

  webui:
    runs-on: ubuntu-latest
    needs: [webui-build, webui-browser]
    if: always()
    steps:
      - name: Verify the hosted build and browser matrix succeeded
        run: |
          if [ "${{ needs.webui-build.result }}" != "success" ] || [ "${{ needs.webui-browser.result }}" != "success" ]; then
            echo "webui-build=${{ needs.webui-build.result }}, webui-browser=${{ needs.webui-browser.result }}"
            exit 1
          fi

  webkit-storage:
    runs-on: macos-15
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
        working-directory: .
      - run: npx playwright install chromium webkit
      - run: node scripts/iphone-storage.test.mjs

  contact-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webui/contact-worker
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            webui/contact-worker/package-lock.json
      - name: Install dependencies for shared contact validation
        run: npm ci
        working-directory: .
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  fitting-wasm:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Install Rust components and WebAssembly target
        run: |
          rustup component add rustfmt clippy
          rustup target add wasm32-unknown-unknown
      - name: Check formatting
        run: cargo fmt --manifest-path browser-runtime/fitting-wasm/Cargo.toml -- --check
      - name: Run tests
        run: cargo test --locked --manifest-path browser-runtime/fitting-wasm/Cargo.toml
      - name: Run Clippy
        run: cargo clippy --locked --manifest-path browser-runtime/fitting-wasm/Cargo.toml --all-targets -- -D warnings
      - name: Build optimized WebAssembly module
        run: cargo build --locked --release --target wasm32-unknown-unknown --manifest-path browser-runtime/fitting-wasm/Cargo.toml
      - name: Install the pinned wasm-bindgen packager
        if: runner.os == 'macOS'
        run: cargo install wasm-bindgen-cli --version 0.2.127 --locked
      # Compare on the same host architecture that produces the committed assets;
      # Cargo's host-dependent metadata changes Wasm function ordering on Linux.
      - name: Verify committed browser bindings are reproducible
        if: runner.os == 'macOS'
        run: npm run check:fitting-wasm
        working-directory: webui
