version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Proposes bumping the pinned drowse submodule to its latest main, so CI here
  # exercises new shared dashboard and engine changes before the site ships them.
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "weekly"
